name: release

# Publishes to npm when a v* tag is pushed. Requires an NPM_TOKEN secret with
# publish rights to the @arcadiasystems scope. Provenance is enabled via OIDC.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: bun install
      - name: Verify gates
        run: |
          bun run lint
          bun run typecheck
          bun run test:coverage
      - name: Build
        run: bun run build
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
