name: ci

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Switch to `bun install --frozen-lockfile` once bun.lock is committed.
      - name: Install
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test (with coverage gate)
        run: bun run test:coverage
      - name: Build
        run: bun run build
      - name: Check published exports
        run: bun run check:exports
      - name: Build example (ensures the demo stays buildable)
        run: bun run build:example
